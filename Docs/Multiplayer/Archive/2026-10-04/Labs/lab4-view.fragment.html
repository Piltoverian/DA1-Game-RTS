<div id="rts-mapgen-lab">
<h3>Lab 4 · Height / noise / walkability</h3>
<div class="viz-controls">
<label class="form-label">Seed<input class="form-control" name="seed" type="number" value="1337"></label>
<label class="form-label">Người chơi<select class="form-select" name="players"><option>2</option><option selected>4</option><option>6</option><option>8</option></select></label>
<label class="form-label">Kích thước<select class="form-select" name="size"><option>128</option><option selected>192</option><option>256</option></select></label>
<label class="form-label">Lớp hiển thị<select class="form-select" name="view"><option value="terrain">Địa hình</option><option value="height">Height</option><option value="walk">Walk map</option><option value="clearance">Clearance</option><option value="regions">Vùng đặt base</option><option value="protected">Vùng phẳng bảo vệ</option><option value="ramps">Kiểm tra ramp</option></select></label>
</div>
<details><summary>Tham số thuật toán</summary><div class="viz-controls" data-parameters></div>
<div class="viz-row"><label class="form-check"><input class="form-check-input" name="certified" type="checkbox" checked><span class="form-check-label">Giới hạn noise theo độ dốc</span></label><label class="form-check"><input class="form-check-input" name="rampEnabled" type="checkbox" checked><span class="form-check-label">Có ramp</span></label></div></details>
<details><summary>Số prefab mỗi nhóm mỏ</summary><div class="viz-controls">
<label class="form-label">Chính / player<input class="form-control" type="number" name="mainCount" min="0" max="12" value="4"></label>
<label class="form-label">Phụ / player<input class="form-control" type="number" name="secondaryCount" min="0" max="12" value="3"></label>
<label class="form-label">Lợi thế / player<input class="form-control" type="number" name="advantageCount" min="0" max="12" value="3"></label>
<label class="form-label">Tranh chấp / cung<input class="form-control" type="number" name="contestedCount" min="0" max="12" value="4"></label>
</div></details>
<div class="viz-row"><button class="btn btn-primary" data-action="generate">Gen map</button><button class="btn" data-action="search">Tìm tốt nhất trong 8 ứng viên</button><span data-hash class="text-small tabular-nums"></span></div>
<div data-status aria-live="polite"></div>
<canvas width="768" height="768" aria-label="Map RTS: P là base, N là expansion; chạm hai ô walkable để tìm đường" role="img" class="cursor-interaction">Map RTS</canvas>
<div class="viz-row text-small" data-legend></div>
<div data-metrics class="tabular-nums"></div>
<div class="viz-controls"><label class="form-label">Từ base<select name="from" class="form-select"></select></label><label class="form-label">Đến base<select name="to" class="form-select"></select></label><button class="btn" data-action="route">Tìm đường</button><button class="btn" data-action="animate">Chạy unit</button></div>
<div data-detail aria-live="polite">Chọn hai ô trên map để thử đường đi.</div>
<div class="table-responsive"><table class="table table-sm"><thead><tr><th>Player</th><th>Starter (ô)</th><th>Mỏ phụ (ô)</th><th>Lợi thế (ô)</th><th>Tranh chấp (ô)</th><th>Đất phẳng (ô)</th><th>Địch gần (ô)</th></tr></thead><tbody></tbody></table></div>
<div data-errors class="text-small"></div>
</div>
<style>
#rts-mapgen-lab{display:grid;gap:12px}#rts-mapgen-lab canvas{width:100%;height:auto;aspect-ratio:1;image-rendering:pixelated}#rts-mapgen-lab summary{color:var(--foreground)}#rts-mapgen-lab .swatch{width:12px;height:12px;display:inline-block}#rts-mapgen-lab details>div{margin-top:12px}
</style>
<script>
/* ENGINE */
</script>
<script>
(()=>{
const root=document.getElementById('rts-mapgen-lab'),q=s=>root.querySelector(s),canvas=q('canvas'),ctx=canvas.getContext('2d');let map,path=[],clickStart=null,animation=0,busy=false;
const specifications=[['protectedRadius','Bán kính vùng phẳng bảo vệ (ô)',4,10,1,6],['amplitude','Noise amplitude',0,4,.1,.8],['wavelength','Noise wavelength (ô)',12,96,1,36],['height','Chênh height (ô)',1,6,.25,3],['rampWidth','Rộng ramp (ô)',4,14,1,9],['slope','Dốc tối đa (°)',10,45,1,25],['radius','Bán kính unit (ô)',.2,2,.05,.65],['tolerance','Budget lệch (%)',5,30,1,15]];
for(const [name,label,min,max,step,value] of specifications){const l=document.createElement('label');l.className='form-label';l.textContent=label+' ';const o=document.createElement('output');o.textContent=value;l.append(o);const input=document.createElement('input');input.className='form-range';Object.assign(input,{name,type:'range',min,max,step,value});input.addEventListener('input',()=>o.textContent=input.value);l.append(input);q('[data-parameters]').append(l);}
function config(){const c={};for(const el of root.querySelectorAll('[name]'))if(!['view','from','to'].includes(el.name))c[el.name]=el.type==='checkbox'?el.checked:Number(el.value);return c;}
function save(){if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState({modelContent:{config:config(),hash:map?.hash,accepted:map?.accepted,errors:map?.errors.map(x=>Number.isFinite(x)?x:null)},privateContent:{view:q('[name=view]').value}})).catch(()=>{});}
function restore(s){if(!s)return;for(const [k,v]of Object.entries(s.modelContent?.config||{})){const el=q('[name="'+k+'"]');if(!el)continue;if(el.type==='checkbox')el.checked=v;else el.value=v;if(el.previousElementSibling?.tagName==='OUTPUT')el.previousElementSibling.textContent=v;}if(s.privateContent?.view)q('[name=view]').value=s.privateContent.view;}
function color(token){const p=document.createElement('span');p.style.color='var('+token+')';root.append(p);const c=getComputedStyle(p).color;p.remove();const nums=c.match(/[\d.]+/g);return nums?nums.slice(0,3).map(Number):[128,128,128];}
function rgb(c){return 'rgb('+c.join(',')+')';}function blend(a,b,t){return a.map((v,i)=>Math.round(v*(1-t)+b[i]*t));}
function draw(dot){if(!map)return;const bg=color('--background'),fg=color('--foreground'),mut=color('--muted'),series=[1,2,3,4,5,6].map(n=>color('--viz-series-'+n)),view=q('[name=view]').value,W=map.W,small=document.createElement('canvas');small.width=W;small.height=W;const sc=small.getContext('2d'),im=sc.createImageData(W,W),minH=map.height.reduce((a,b)=>Math.min(a,b),Infinity),maxH=map.height.reduce((a,b)=>Math.max(a,b),-Infinity);for(let i=0;i<W*W;i++){let c;const k=map.kind[i];if(view==='walk')c=map.walk[i]?blend(bg,series[0],.65):blend(bg,fg,.18);else if(view==='height')c=blend(bg,series[0],(.15+.8*(map.height[Math.floor(i/W)*(W+1)+i%W]-minH)/Math.max(.01,maxH-minH)));else if(view==='clearance')c=blend(bg,series[1],Math.min(1,map.clearance[i]/10));else if(view==='regions'){const x=i%W+.5-W/2,y=Math.floor(i/W)+.5-W/2;const sector=((Math.atan2(y,x)-map.sectorOffset+map.sectorWidth/2)%(2*Math.PI)+2*Math.PI)%(2*Math.PI),owner=Math.floor(sector/map.sectorWidth);c=blend(bg,series[owner%6],Math.hypot(x,y)<W*.30?.06:.20);}else{const v=Math.floor(i/W)*(W+1)+i%W,hh=map.height[v],level=(hh-minH)/Math.max(.01,maxH-minH),shadow=Math.max(-.22,Math.min(.22,(map.height[v+1]-hh+map.height[v+W+1]-hh)*.28));c=blend(blend(bg,series[0],.28),blend(bg,series[1],.65),level);c=blend(c,shadow>0?fg:bg,Math.abs(shadow));if(k===4)c=blend(c,fg,.3);if(k===2)c=blend(c,fg,.15);if(view==='protected'){const x=i%W+.5,y=Math.floor(i/W)+.5;if(map.bases.some(b=>Math.hypot(x-b.x,y-b.y)<=map.cfg.protectedRadius))c=blend(bg,series[2],.75);}if(view==='ramps'&&k===3)c=blend(bg,series[2],.7);}im.data.set([...c,255],i*4);}sc.putImageData(im,0,0);ctx.imageSmoothingEnabled=false;ctx.drawImage(small,0,0,768,768);const s=768/W;ctx.strokeStyle=rgb(series[3]);ctx.lineWidth=3;if(path.length){ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(p.x*s,p.y*s):ctx.moveTo(p.x*s,p.y*s));ctx.stroke();}
ctx.font='500 16px sans-serif';for(const b of map.bases){ctx.fillStyle=rgb(bg);ctx.fillRect(b.x*s-13,b.y*s-11,30,22);ctx.fillStyle=rgb(fg);ctx.fillText('P'+(b.id+1),b.x*s-11,b.y*s+6);}
for(const p of map.placements){ctx.fillStyle=rgb(series[p.role==='contested'?5:p.role==='advantage'?3:4]);ctx.fillRect(p.x*s,p.y*s,Math.max(5,2*s),Math.max(5,2*s));ctx.strokeStyle=rgb(fg);ctx.lineWidth=1;ctx.strokeRect(p.x*s,p.y*s,Math.max(5,2*s),Math.max(5,2*s));}if(dot){ctx.fillStyle=rgb(fg);ctx.beginPath();ctx.arc(dot.x*s,dot.y*s,5,0,Math.PI*2);ctx.fill();}
if(view==='ramps'){ctx.strokeStyle=rgb(fg);ctx.lineWidth=1.5;ctx.setLineDash([4,4]);for(const b of map.bases){ctx.beginPath();b.ramp.points.forEach((p,i)=>i?ctx.lineTo(p.x*s,p.y*s):ctx.moveTo(p.x*s,p.y*s));ctx.stroke();}ctx.setLineDash([]);}const legend=q('[data-legend]');legend.replaceChildren();const items=view==='regions'?[[series[0],'N vùng ngoài tâm · P = base'],[series[5],'Mỏ tranh chấp rải trong các cung trung tâm']]:['terrain','protected','ramps'].includes(view)?[[series[0],'Thấp'],[series[1],'Cao'],[fg,'Đá / dốc'],[series[2],view==='protected'?'Vùng phẳng':view==='ramps'?'Lối chuyển độ cao':'Height liên tục'],[series[4],'Chính / phụ'],[series[3],'Lợi thế'],[series[5],'Tranh chấp']]:view==='walk'?[[series[0],'Đi được'],[fg,'Bị chặn']]:[[series[view==='height'?0:1],view==='height'?'Sáng hơn = cao hơn':'Sáng hơn = clearance lớn hơn']];for(const [c,label] of items){const span=document.createElement('span'),sw=document.createElement('i');sw.className='swatch';sw.style.background=rgb(c);span.append(sw,' '+label);legend.append(span);}}
const fmt=v=>Number.isFinite(v)?v.toFixed(1):'∞';
function present(m){cancelAnimationFrame(animation);map=m;path=[];clickStart=null;draw();q('[data-hash]').textContent=map.placements.length+' prefab · hash '+m.hash+' · ứng viên '+(m.attempt+1);q('[data-status]').textContent=m.accepted?'Đạt các kiểm tra lab':'Bị loại: '+m.violations.join(' · ');q('[data-status]').className=m.accepted?'':'text-destructive';q('[data-metrics]').textContent='Walk '+(m.walkRatio*100).toFixed(1)+'% · '+m.islandCount+' đảo · α '+m.alpha.toFixed(3)+' · dốc cực đại '+m.maxSlope.toFixed(2)+'°';q('tbody').replaceChildren();for(const r of m.rows){const tr=document.createElement('tr');for(const value of ['P'+(r.player+1),r.starter.length?r.starter.map(fmt).join(' / '):'—',r.natural.length?r.natural.map(fmt).join(' / '):'—',r.advantage.length?r.advantage.map(fmt).join(' / '):'—',fmt(r.contested),r.area,fmt(r.nearest)]){const td=document.createElement('td');td.textContent=value;tr.append(td);}q('tbody').append(tr);}q('[data-errors]').textContent=['Mỏ chính','Mỏ phụ','Đất phẳng','Địch gần','Áp lực','Mỏ lợi thế','Tranh chấp'].map((n,i)=>n+' lệch '+fmt(m.errors[i]*100)+'%').join(' · ');for(const name of ['from','to']){const el=q('[name='+name+']');el.replaceChildren();m.bases.forEach((b,i)=>el.add(new Option('P'+(i+1),i)));}q('[name=to]').value='1';q('[data-detail]').textContent='Chọn hai ô walkable để tìm đường; độ dài tính bằng ô.';}
async function generate(search=false,persist=true){if(busy)return;busy=true;root.querySelectorAll('button,input,select').forEach(b=>b.disabled=true);try{const c=config();let best=null,passed=0;for(let a=0;a<(search?8:1);a++){q('[data-status]').textContent='Đang tính ứng viên '+(a+1)+'…';await new Promise(r=>setTimeout(r,20));const m=RTSLab.generate(c,a);if(m.accepted)passed++;if(!best||m.score<best.score)best=m;}present(best);q('[data-hash]').textContent=best.placements.length+'/'+best.expectedPlacements+' prefab · hash '+best.hash+' · ứng viên '+(best.attempt+1);if(search)q('[data-status]').textContent+=' · '+passed+'/8 ứng viên đạt';if(persist)save();}catch(e){q('[data-status]').textContent=e.message;q('[data-status]').setAttribute('role','alert');}finally{busy=false;root.querySelectorAll('button,input,select').forEach(b=>b.disabled=false);}}
function find(a,b){cancelAnimationFrame(animation);const result=RTSLab.route(map,a,b);path=result.path;draw();q('[data-detail]').textContent=path.length?'Đường đi '+fmt(result.length)+' ô · '+path.length+' node · không cắt góc':'Không có đường hợp lệ giữa hai điểm';}
q('[data-action=generate]').onclick=()=>generate();q('[data-action=search]').onclick=()=>generate(true);q('[name=view]').onchange=()=>{draw();save();};q('[data-action=route]').onclick=()=>{if(map)find(map.bases[Number(q('[name=from]').value)],map.bases[Number(q('[name=to]').value)]);};q('[data-action=animate]').onclick=()=>{cancelAnimationFrame(animation);if(!path.length)return;const t=performance.now();function frame(now){const i=Math.min(path.length-1,Math.floor((now-t)/60));draw(path[i]);if(i<path.length-1)animation=requestAnimationFrame(frame);}animation=requestAnimationFrame(frame);};canvas.onclick=e=>{if(!map||busy)return;const r=canvas.getBoundingClientRect(),p={x:Math.floor((e.clientX-r.left)/r.width*map.W),y:Math.floor((e.clientY-r.top)/r.height*map.H)},i=p.y*map.W+p.x;if(!map.walk[i]){q('[data-detail]').textContent='Ô '+p.x+','+p.y+' bị chặn · dốc '+fmt(map.slope[i])+'° · clearance '+fmt(map.clearance[i]);return;}if(!clickStart){clickStart=p;q('[data-detail]').textContent='Điểm đầu '+p.x+','+p.y+' · chọn điểm đến';}else{find(clickStart,p);clickStart=null;}};
restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{const before=JSON.stringify(config());restore(e.detail?.globals?.widgetState);if(before!==JSON.stringify(config()))generate(false,false);else draw();});new MutationObserver(()=>draw()).observe(document.documentElement,{attributes:true,attributeFilter:['class','style']});generate(false,false);window.RTSLabUI={get map(){return map;},get path(){return path;},generate};
})();
</script>
