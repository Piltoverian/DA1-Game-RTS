<div id="rts-cliff-bake-lab">
<h3>Toàn cảnh map · terrain / ramp / tài nguyên</h3>
<div class="viz-controls">
<label class="form-label">Cảnh thử<select name="scene" class="form-select"><option value="demo">Hai tầng · 2 base</option><option value="noise" selected>Map đầy đủ</option></select></label>
<label class="form-label">Người chơi (map đầy đủ)<input name="players" class="form-control" type="number" min="2" max="10" value="10"></label>
<label class="form-label">Bán kính bảo vệ (ô, map đầy đủ)<input name="protectedRadius" class="form-control" type="number" min="4" max="16" value="6"></label>
<label class="form-label">Lớp xem<select name="view" class="form-select"><option value="terrain">Toàn cảnh địa hình</option><option value="levels">HeightLevel</option><option value="walk">Walk map cuối</option><option value="bake">Cliff và ramp</option></select></label>
<label class="form-label">Seed<input name="seed" class="form-control" type="number" value="1337"></label>
<label class="form-label">Chênh tầng cảnh thử<select name="delta" class="form-select"><option>1</option><option>2</option><option>3</option></select></label>
</div>
<div data-status aria-live="polite"></div>
<div data-health class="text-small" aria-live="polite"></div>
<canvas width="1024" height="1024" class="cursor-interaction" role="img" aria-label="Map phẳng, tầng nguyên, dải cliff chặn và cửa ramp đi được">Map thử nghiệm</canvas>
<div class="viz-row"><label class="form-check"><input name="debug" class="form-check-input" type="checkbox"><span class="form-check-label">Hiện vòng cluster và nhãn ramp</span></label><span class="text-small">P = base · mỏ chính/phụ · mỏ lợi thế · mỏ tranh chấp · Y = 0</span></div>
<div data-detail aria-live="polite">Chọn hai ô đi được để thử đường.</div>
<details><summary>Height, cliff và ramp</summary><div class="viz-controls" data-parameters></div></details>
<div class="viz-row"><label class="form-check"><input name="rampEnabled" class="form-check-input" type="checkbox" checked><span class="form-check-label">Mở ramp</span></label><button class="btn btn-primary" data-generate>Gen / bake</button><button class="btn" data-route>Tìm đường P1 → P2</button><button class="btn" data-animate>Chạy unit</button></div>
<details><summary>Cluster tài nguyên</summary><div class="viz-controls" data-cluster-controls></div></details>
</div>
<style>#rts-cliff-bake-lab{display:grid;gap:12px}#rts-cliff-bake-lab canvas{width:100%;height:auto;aspect-ratio:1;image-rendering:pixelated}</style>
<script>
/* ENGINE */
</script>
<script>
(()=>{
const root=document.getElementById('rts-cliff-bake-lab'),q=s=>root.querySelector(s),canvas=q('canvas'),ctx=canvas.getContext('2d');let map,path=[],first=null,animation=0,busy=false;
for(const [name,label,min,max,step,value]of [['levelStep','Khoảng chia tầng noise',.5,3,.25,1],['cliffCells','Bề dày cliff / chênh 1 tầng (ô)',1,3,1,1],['rampWidthMin','Rộng ramp nhỏ nhất (ô)',1,12,1,3],['rampWidthMax','Rộng ramp lớn nhất (ô)',1,12,1,7],['rampsPerBorder','Số cửa / ranh vùng',1,4,1,2],['radius','Bán kính unit (ô)',.1,1.5,.05,.2]]){const l=document.createElement('label');l.className='form-label';l.append(label+' ');const o=document.createElement('output');o.textContent=value;l.append(o);const el=document.createElement('input');Object.assign(el,{name,type:'range',min,max,step,value});el.className='form-range';el.oninput=()=>o.textContent=el.value;l.append(el);q('[data-parameters]').append(l);}
for(const [name,label,value,min,max]of [['clusterMin','Prefab tối thiểu / cluster',2,1,12],['clusterMax','Prefab tối đa / cluster',4,1,12],['mainClusters','Cluster chính / player',1,0,6],['secondaryClusters','Cluster phụ / player',1,0,6],['advantageClusters','Cluster lợi thế / player',1,0,6],['contestedClusters','Cluster tranh chấp / cung',1,0,6]]){const labelEl=document.createElement('label');labelEl.className='form-label';labelEl.append(label);const input=document.createElement('input');Object.assign(input,{name,type:'number',value,min,max});input.className='form-control';labelEl.append(input);q('[data-cluster-controls]').append(labelEl);}
function cfg(){const c={};for(const el of root.querySelectorAll('[name]')){c[el.name]=el.type==='checkbox'?el.checked:el.type==='range'||el.type==='number'||el.name==='delta'?Number(el.value):el.value;if(el.type==='number'&&el.name!=='seed'&&(!Number.isInteger(c[el.name])||c[el.name]<Number(el.min)||c[el.name]>Number(el.max)))throw Error('Thông số phải là số nguyên trong khoảng của control');}if(c.clusterMin>c.clusterMax)throw Error('Min cluster phải ≤ max cluster');if(c.rampWidthMin>c.rampWidthMax)throw Error('Rộng ramp min phải ≤ max');return c;}
function color(token){const s=document.createElement('span');s.style.color='var('+token+')';root.append(s);const c=getComputedStyle(s).color;s.remove();return c.match(/[\d.]+/g).slice(0,3).map(Number);}
const blend=(a,b,t)=>a.map((v,i)=>Math.round(v*(1-t)+b[i]*t)),rgb=c=>'rgb('+c.join(',')+')';
function draw(dot){if(map)RTSOverview.draw(canvas,map,{view:q('[name=view]').value,debug:q('[name=debug]').checked,path,dot},color);}
function demo(c){const W=48,V=W+1,T=W*W,height=new Float64Array(V*V),levels=new Int16Array(T),physical=new Uint8Array(T),bases=[{x:10,y:24,id:0},{x:38,y:24,id:1}];for(let y=0;y<V;y++)for(let x=0;x<V;x++)height[y*V+x]=x<W/2?0:c.delta*c.levelStep;for(let y=0;y<W;y++)for(let x=0;x<W;x++){levels[y*W+x]=x<W/2?0:c.delta;physical[y*W+x]=x>1&&y>1&&x<W-2&&y<W-2?1:0;}const config={...c,protectedRadius:3,levelOverride:levels};const baked=RTSBake.build(physical,height,W,W,config,c.seed,RTSLab5.components,bases);const nav=RTSLab5.compileWalk(baked.physical,W,W,c.radius);return {cfg:c,W,H:W,bases,levels:baked.levels,physical:baked.physical,walk:nav.walk,cliffMask:baked.cliff,rampCells:baked.rampCells,ramps:baked.ramps,islandCount:RTSLab5.components(nav.walk,W,W).counts.length};}
function health(){const parts=RTSLab5.components(map.walk,map.W,map.H),labels=map.bases.map(b=>parts.labels[b.y*map.W+b.x]),groups=new Set(labels.filter(Boolean)).size;let overlaps=0,min=Infinity;const r=map.cfg.protectedRadius??3;for(let i=0;i<map.bases.length;i++)for(let j=0;j<i;j++){const d=Math.hypot(map.bases[i].x-map.bases[j].x,map.bases[i].y-map.bases[j].y);min=Math.min(min,d);if(d<2*(r+2))overlaps++;}q('[data-health]').textContent=map.bases.length+' base · '+groups+' nhóm base kết nối · khoảng cách base nhỏ nhất '+min.toFixed(1)+' ô · '+overlaps+' cặp vùng bảo vệ + collar chồng nhau · '+map.ramps.filter(r=>r.connectivityRepair).length+' cửa bổ sung nối base · candidate '+((map.attempt??0)+1);}
function persist(){if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState({modelContent:{config:cfg(),ramps:map.ramps.length,islands:map.islandCount,commonY:0,navigation:'walk mask only'},privateContent:{}})).catch(()=>{});}
async function generate(save=true){if(busy)return;busy=true;root.querySelectorAll('button,input,select').forEach(el=>el.disabled=true);cancelAnimationFrame(animation);q('[data-status]').textContent='Đang bake…';await new Promise(r=>setTimeout(r,20));try{const c=cfg();map=c.scene==='demo'?demo(c):RTSLab5.generate({...c,mainCount:0,secondaryCount:0,advantageCount:0,contestedCount:0});map=RTSClusters.generate(map,c,RTSLab5);path=[];first=null;draw();health();q('[data-status]').textContent=map.ramps.length+' cửa ramp · '+map.islandCount+' vùng đi tách rời · '+new Set(map.levels).size+' mức cao · '+map.clusters.length+'/'+map.clusterRequested+' cluster · '+map.resources.length+' prefab · mọi prefab có đường';q('[data-detail]').textContent='Chọn hai ô đi được hoặc tìm đường P1 → P2.';if(save)persist();}catch(e){q('[data-status]').textContent=e.message;q('[data-status]').setAttribute('role','alert');}finally{busy=false;root.querySelectorAll('button,input,select').forEach(el=>el.disabled=false);}}
function find(a,b){const r=RTSLab5.route(map,a,b);path=r.path;cancelAnimationFrame(animation);draw();q('[data-detail]').textContent=path.length?'Đường '+r.length.toFixed(1)+' ô · '+path.length+' node · Y = 0':'Không có đường trên walk map cuối';}
q('[name=debug]').onchange=()=>{draw();persist();};q('[data-generate]').onclick=()=>generate();q('[data-route]').onclick=()=>find(map.bases[0],map.bases[1]);q('[name=view]').onchange=()=>{draw();persist();};q('[data-animate]').onclick=()=>{if(!path.length)return;cancelAnimationFrame(animation);const t=performance.now();function frame(now){const i=Math.min(path.length-1,Math.floor((now-t)/80));draw(path[i]);if(i<path.length-1)animation=requestAnimationFrame(frame);}animation=requestAnimationFrame(frame);};canvas.onclick=e=>{if(!map||busy)return;const r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*map.W),y=Math.floor((e.clientY-r.top)/r.height*map.H),i=y*map.W+x;const resource=(map.resources||[]).find(p=>x>=p.x&&x<p.x+2&&y>=p.y&&y<p.y+2);if(resource){const c=map.clusters[resource.cluster],player=c.accessiblePlayers[0],b=map.bases[player],field=RTSLab5.dijkstra(map.walk,map.W,map.H,b.y*map.W+b.x).dist;let best=-1,d=Infinity;for(let yy=resource.y-3;yy<=resource.y+4;yy++)for(let xx=resource.x-3;xx<=resource.x+4;xx++){const j=yy*map.W+xx;if(xx<0||yy<0||xx>=map.W||yy>=map.H||map.levels[j]!==resource.level||!map.walk[j])continue;if(field[j]<d){d=field[j];best=j;}}if(best>=0)find(b,{x:best%map.W,y:Math.floor(best/map.W)});q('[data-detail]').textContent+=' · cluster '+(c.id+1)+' · tầng '+c.level+' · '+c.resources.length+' prefab';return;}if(!map.walk[i]){q('[data-detail]').textContent='Ô '+x+','+y+' · tầng '+map.levels[i]+' · bị chặn';return;}if(first){find(first,{x,y});first=null;}else{first={x,y};q('[data-detail]').textContent='Điểm đầu '+x+','+y+' · tầng '+map.levels[i]+' · chọn điểm đến';}};
function restore(state){for(const [k,v]of Object.entries(state?.modelContent?.config||{})){const el=q('[name='+k+']');if(!el)continue;if(el.type==='checkbox')el.checked=v;else el.value=v;if(el.previousElementSibling?.tagName==='OUTPUT')el.previousElementSibling.textContent=el.value;}}
restore(window.openai?.widgetState);q('[name=scene]').value='noise';q('[name=view]').value='terrain';window.addEventListener('openai:set_globals',e=>{const before=JSON.stringify(cfg());restore(e.detail?.globals?.widgetState);if(before!==JSON.stringify(cfg()))generate(false);});new MutationObserver(()=>draw()).observe(document.documentElement,{attributes:true,attributeFilter:['class','style']});generate(false);window.RTSLab5UI={get map(){return map;},get path(){return path;},generate};
})();
</script>
